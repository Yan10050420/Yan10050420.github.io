<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yan10050420 | 个人主页</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 3rem 3.5rem;
      max-width: 600px;
      width: 100%;
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.6),
        inset 0 1px 1px rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      color: #fff;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
      user-select: none;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
      margin-bottom: 0.25rem;
    }

    .badge {
      display: inline-block;
      background: rgba(102, 126, 234, 0.25);
      color: #a5b4fc;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.3rem 0.9rem;
      border-radius: 100px;
      margin: 0.75rem auto 1.5rem;
      text-align: center;
      border: 1px solid rgba(102, 126, 234, 0.3);
    }

    .badge-wrapper {
      text-align: center;
    }

    .bio {
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .bio strong {
      color: #a5b4fc;
      font-weight: 600;
    }

    .interests {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .interests span {
      background: rgba(255, 255, 255, 0.07);
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.85rem;
      padding: 0.4rem 1rem;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.2s;
    }

    .interests span:hover {
      background: rgba(102, 126, 234, 0.2);
      color: #c7d2fe;
      border-color: rgba(102, 126, 234, 0.3);
    }

    .divider {
      height: 1px;
      background: linear-gradient(
        to right,
        transparent,
        rgba(255, 255, 255, 0.12),
        transparent
      );
      margin: 1.5rem 0;
    }

    .footer-text {
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.8rem;
    }

    .footer-text a {
      color: rgba(165, 180, 252, 0.5);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-text a:hover {
      color: #a5b4fc;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">Y</div>

    <h1>Yan10050420</h1>

    <div class="badge-wrapper">
      <span class="badge">🚀 学习者 · 创作者</span>
    </div>

    <p class="bio">
      你好！我是 <strong>Yan10050420</strong>。<br>
      一名对技术充满热情的探索者，目前正在深入学习
      <strong>Agentic AI</strong> —— 构建能够自主感知、推理
      并行动的智能体。
    </p>

    <div class="interests">
      <span>🤖 Agentic AI</span>
      <span>💻 编程</span>
      <span>🌐 开源</span>
      <span>📚 持续学习</span>
    </div>

    <div class="divider"></div>

    <p class="footer-text">
      ✨ 正在用代码让世界更智能 · 
      <a href="#">GitHub</a>
    </p>
  </div>
</body>
</html>
